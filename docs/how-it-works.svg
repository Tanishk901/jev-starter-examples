<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="300" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 1. Input -->
  <rect x="24" y="70" width="170" height="150" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="109" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">1. Input</text>
  <text x="109" y="132" text-anchor="middle" font-size="13" fill="#57606a">messages.json</text>
  <text x="109" y="152" text-anchor="middle" font-size="13" fill="#57606a">tickets.json</text>
  <text x="109" y="190" text-anchor="middle" font-size="12" fill="#57606a">one item at a time</text>

  <line x1="194" y1="145" x2="236" y2="145" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Jev -->
  <rect x="240" y="30" width="250" height="230" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="365" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#0550ae">2. Jev judges (1 request)</text>
  <text x="365" y="78" text-anchor="middle" font-size="12" fill="#0550ae">questions answered in parallel</text>
  <rect x="258" y="94" width="214" height="44" rx="7" fill="#ffffff" stroke="#54aeff"/>
  <text x="270" y="113" font-size="13" font-weight="700" fill="#1f2328">Choice</text>
  <text x="270" y="130" font-size="12" fill="#57606a">team: billing 78%, technical 20%</text>
  <rect x="258" y="146" width="214" height="44" rx="7" fill="#ffffff" stroke="#54aeff"/>
  <text x="270" y="165" font-size="13" font-weight="700" fill="#1f2328">Score</text>
  <text x="270" y="182" font-size="12" fill="#57606a">urgency: 2.4 on a 0–3 scale</text>
  <rect x="258" y="198" width="214" height="44" rx="7" fill="#ffffff" stroke="#54aeff"/>
  <text x="270" y="217" font-size="13" font-weight="700" fill="#1f2328">Noul</text>
  <text x="270" y="234" font-size="12" fill="#57606a">security: 4%   has_detail: 96%</text>

  <line x1="490" y1="145" x2="532" y2="145" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Python rules -->
  <rect x="536" y="70" width="190" height="150" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="631" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#7d4e00">3. Your Python rules</text>
  <text x="631" y="130" text-anchor="middle" font-size="12" fill="#7d4e00">thresholds and if/else</text>
  <text x="631" y="150" text-anchor="middle" font-size="12" fill="#7d4e00">urgency → P1–P4</text>
  <text x="631" y="170" text-anchor="middle" font-size="12" fill="#7d4e00">unsure → a person</text>
  <text x="631" y="198" text-anchor="middle" font-size="11" font-style="italic" fill="#7d4e00">Jev never decides</text>

  <line x1="726" y1="120" x2="768" y2="95" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="726" y1="170" x2="768" y2="195" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Outputs -->
  <rect x="772" y="50" width="164" height="90" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="854" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#116329">4. Sorted</text>
  <text x="854" y="104" text-anchor="middle" font-size="12" fill="#116329">sorted/&lt;category&gt;/</text>
  <text x="854" y="122" text-anchor="middle" font-size="12" fill="#116329">queues/&lt;team&gt;.json</text>
  <rect x="772" y="160" width="164" height="90" rx="10" fill="#fbefff" stroke="#c297ff"/>
  <text x="854" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#6639ba">Human review</text>
  <text x="854" y="214" text-anchor="middle" font-size="12" fill="#6639ba">vague, risky or unsure</text>
  <text x="854" y="232" text-anchor="middle" font-size="12" fill="#6639ba">with the reason attached</text>
</svg>
