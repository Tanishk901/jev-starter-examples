name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Unit tests for the routing rules
        run: python -m unittest -v
      # No API key in CI, so both scripts use fake answers: free, and no secrets needed.
      - name: Run message sorter (fake mode)
        run: python sorter.py
      - name: Run ticket router (fake mode)
        run: python router.py
